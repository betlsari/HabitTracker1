version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: habittracker
      POSTGRES_USER: habittracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - habittracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habittracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./HabitTrackerApi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=habittracker;Username=habittracker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in .env - use at least 32 random bytes}
      Jwt__Issuer: "HabitTrackerApi"
      Jwt__Audience: "HabitTrackerApiUsers"
      Email__SmtpHost: "smtp.gmail.com"
      Email__SmtpPort: "587"
      Email__SenderEmail: "${EMAIL_SENDER:-}"
      Email__SenderPassword: "${EMAIL_PASSWORD:-}"
      Email__SenderName: "HabitTracker"

      Fcm__ProjectId: "${FCM_PROJECT_ID:-}"
      Fcm__ServiceAccountJson: "${FCM_SERVICE_ACCOUNT_JSON:-}"

      # DÜZELTİLDİ: Program.cs'deki HealthCheckApiKeyFilter, IsProduction()
      # olduğunda /health* uç noktalarına erişim için X-Health-Key header'ı
      # zorunlu kılıyor (yoksa 404 döner). Önceden bu ortam değişkeni hiç
      # tanımlı değildi ve aşağıdaki healthcheck komutu header göndermiyordu;
      # ASPNETCORE_ENVIRONMENT=Production'a çekildiğinde container healthcheck'i
      # sürekli "unhealthy" dönecekti. Artık aynı anahtar hem uygulamaya hem de
      # healthcheck komutuna veriliyor.
      HealthCheck__ApiKey: "${HEALTH_CHECK_API_KEY:-}"
    volumes:
      - ./secrets:/app/secrets:ro

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Health-Key: ${HEALTH_CHECK_API_KEY:-}",
          "http://localhost:8080/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  habittracker_pgdata:
