version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: habittracker
      POSTGRES_USER: habittracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      # DÜZELTİLDİ (madde 12): Postgres portu artık sadece localhost'a
      # (127.0.0.1) bind ediliyor, tüm ağ arayüzlerine değil. Prod'da bu
      # dosyanın bir kopyasını kullanıyorsanız, DB'ye dışarıdan hiç ihtiyaç
      # yoksa bu "ports" bloğunu tamamen kaldırmanız önerilir (container'lar
      # zaten aynı Docker network'ü üzerinden "db:5432" ile erişebiliyor).
      - "127.0.0.1:5432:5432"
    volumes:
      - habittracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habittracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./HabitTrackerApi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # DÜZELTİLDİ (madde 11): Varsayılan artık "Production". Önceden
      # varsayılan "Development" idi; biri .env dosyasında bu değişkeni
      # tanımlamayı unutursa uygulama sessizce Development modunda ayağa
      # kalkıyordu (Swagger açık, HSTS yok, Program.cs'deki production
      # validasyonları [Cors:AllowedOrigins, Email ayarları, HealthCheck
      # ApiKey zorunluluğu] tamamen atlanıyordu). Artık .env'de
      # ASPNETCORE_ENVIRONMENT=Development açıkça YAZILMADIKÇA uygulama
      # Production modunda başlar; eksik/yanlış yapılandırılmış prod
      # secret'ları varsa Program.cs zaten fail-fast ile başlangıçta hata
      # fırlatır (bu istenen davranıştır — "sessizce güvensiz mod" yerine
      # "gürültülü hata").
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=habittracker;Username=habittracker;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set in .env - use at least 32 random bytes}
      Jwt__Issuer: "HabitTrackerApi"
      Jwt__Audience: "HabitTrackerApiUsers"
      Email__SmtpHost: "smtp.gmail.com"
      Email__SmtpPort: "587"
      Email__SenderEmail: "${EMAIL_SENDER:-}"
      Email__SenderPassword: "${EMAIL_PASSWORD:-}"
      Email__SenderName: "HabitTracker"

      Fcm__ProjectId: "${FCM_PROJECT_ID:-}"
      Fcm__ServiceAccountJson: "${FCM_SERVICE_ACCOUNT_JSON:-}"

      HealthCheck__ApiKey: "${HEALTH_CHECK_API_KEY:-}"
    volumes:
      - ./secrets:/app/secrets:ro

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "X-Health-Key: ${HEALTH_CHECK_API_KEY:-}",
          "http://localhost:8080/health/live",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  habittracker_pgdata:
